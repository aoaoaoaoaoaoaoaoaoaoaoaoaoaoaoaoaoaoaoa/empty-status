# Complete empty-status 5 configuration.
# Units are declared from rightmost to leftmost.

[global]
# Spaces on each side of every block.
padding = 1

[[units]]
type = "Weather"
# Weather and AQI probes are clamped to a 120-second minimum.
# Left cycles immediate/forecast; right cycles temperature/humidity/U.S. AQI.
poll_interval = 300.0
lat = 0.0
lon = 0.0
units = "celsius"

[[units]]
type = "Time"
poll_interval = 1.0
format = "%a %b %d %Y - %H:%M"

[[units]]
type = "Cpu"
poll_interval = 0.333

[[units]]
type = "Mem"
poll_interval = 0.333

[[units]]
type = "Disk"
poll_interval = 0.333
# Exactly one of disk, partlabel, or partuuid is required.
disk = "nvme0n1p1"
smoothing_sec = 0.5
write_peak_ref = 300000000.0
read_peak_ref = 1500000000.0

[[units]]
type = "Wifi"
poll_interval = 0.333
interface = "wlan0"

[[units]]
type = "Bat"
poll_interval = 0.333
bat_id = 0
power_smoothing_sec = 2.5

[[units]]
type = "Net"
poll_interval = 0.333
interface = "eth0"
smoothing_window_sec = 0.333
ping_server = "8.8.8.8"
ping_window = 25

[[units]]
type = "Quota"
# Quota probes are clamped to a 15-second minimum.
# Left toggles remaining/reset data; right cycles sources; middle refreshes.
poll_interval = 300.0
label = "quota"
providers = [
  { source = "claude" },
  { source = "codex" },
  # OpenRouter's credits endpoint requires a management key.
  { source = "openrouter", token_file = "/run/secrets/openrouter-management-key" },
]
stale_after_sec = 1800.0
error_after_sec = 86400.0
