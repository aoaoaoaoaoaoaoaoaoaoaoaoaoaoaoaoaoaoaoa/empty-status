schema = 1

[product]
name = "empty-status"
package = "empty-status"
binary = "empty-status"
profile = "platform-bound"

[coordinates]
release-tested = ["linux-x86_64"]

[[exclusions]]
coordinate = "macos-aarch64"
reason = "The product is an i3bar protocol peer backed by Linux sysfs, procfs, and netlink."

[[exclusions]]
coordinate = "macos-x86_64"
reason = "The product is an i3bar protocol peer backed by Linux sysfs, procfs, and netlink."

[[exclusions]]
coordinate = "windows-x86_64"
reason = "The product is an i3bar protocol peer backed by Linux sysfs, procfs, and netlink."

[delivery]
linux = "cargo"

[[proofs]]
name = "source"
laws = ["source"]
run = ["python3", "scripts/check.py", "deep"]
timeout-minutes = 45

[[proofs]]
name = "security"
laws = ["security"]
run = ["scripts/audit"]
timeout-minutes = 15

[[proofs]]
name = "source-package"
laws = ["source-package"]
run = ["scripts/package"]
timeout-minutes = 30

[[proofs]]
name = "runtime"
laws = ["host", "lifecycle"]
run = ["scripts/prove-runtime"]
coordinates = ["linux-x86_64"]
timeout-minutes = 45
